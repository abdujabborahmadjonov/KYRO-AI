# One-click Render deployment for Kyro.
# In Render: New → Blueprint → select this repo → set the secret env vars.
#
# autoDeploy is off on purpose: GitHub Actions (.github/workflows/ci.yml) runs
# typecheck + build + a boot smoke test on every push to main and only then fires
# the service's Deploy Hook. Set the hook URL as the RENDER_DEPLOY_HOOK_URL secret
# in the GitHub repo, or flip autoDeploy back to true to deploy straight from git.
services:
  - type: web
    name: kyro
    runtime: node
    plan: free
    branch: main
    autoDeploy: false
    buildCommand: npm ci && npm run build && npm run index-corpus
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY # GPT-4o stories + gpt-image-1 illustrations
        sync: false
      - key: DEEPGRAM_API_KEY # voice agent + Read-to-me narration
        sync: false
      - key: ANTHROPIC_API_KEY # optional alternative story generator
        sync: false
      - key: MEDPLUM_CLIENT_ID # optional real EHR (mock FHIR store otherwise)
        sync: false
      - key: MEDPLUM_CLIENT_SECRET
        sync: false
